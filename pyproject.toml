[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juggletrack"
version = "0.1.0"
description = "Juggling run/catch/drop tracker: physics-first video analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.7",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/juggletrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
