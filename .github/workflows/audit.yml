name: Dependency audit

on:
  # Advisories land on packages that no commit here touches, so a pull-request
  # check alone would miss them.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv audit --locked
